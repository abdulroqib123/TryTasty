    <script>
      async function loadYouTubeFeed() {
        const url =
          "https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=UCCAtvnaTk1qiE-uef8k4rCA";

        const res = await fetch(url);
        const data = await res.json();

        const videosContainer = document.getElementById("videosPage");
        videosContainer.innerHTML = "";

        data.items.forEach((item) => {
          const videoId = item.guid.replace("yt:video:", "");

          const iframe = document.createElement("iframe");
          iframe.src = `https://www.youtube.com/embed/${videoId}`;
          iframe.allowFullscreen = true;

          videosContainer.appendChild(iframe);
        });
      }

      loadYouTubeFeed();
    </script>
