  <body>
    <header>
      <img
        src="https://res.cloudinary.com/dc1bmavl5/image/upload/v1746104911/TryTasty-logo_lcvbvd.png"

            >Home</span
          >
        </a>
      </nav>
    </header>
    <main>
      <section id="recipeSubmissionForm">
        <form action="https://formspree.io/f/myzpzgej" method="POST">
          <label>
            Your name:
            <input
              type="text"
              name="name"
              placeholder="e.g. John Mally"
              required
            />
          </label>

          <label>
            Your email:
            <input
              type="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </label>

          <label>
            Your recipe:
            <textarea
              name="message"
              placeholder="Ingredients:egg, milk. Instructions:Mix egg and milk with..."
            ></textarea>
          </label>
          <p>
            <b>Note:</b>Your ingredients and intructions should have a column(:)
          </p>

          <button type="submit">Submit</button>
        </form>
      </section>
      <script>
        // Auto-resize textareas
        document.querySelectorAll("textarea").forEach((textarea) => {
          textarea.addEventListener("input", () => {
            textarea.style.height = "auto";
            textarea.style.height = textarea.scrollHeight + "px";
          });
        });
      </script>
    </main>
    
  </body>
